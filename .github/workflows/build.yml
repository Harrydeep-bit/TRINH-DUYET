name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cập nhật danh sách chặn quảng cáo mới nhất
        run: |
          if curl -fsSL https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts -o /tmp/hosts; then
            grep '^0\.0\.0\.0 ' /tmp/hosts | awk '{print $2}' | grep -v '^0\.0\.0\.0$' | sort -u > /tmp/list.txt
            if [ "$(wc -l < /tmp/list.txt)" -gt 20000 ]; then cp /tmp/list.txt app/src/main/assets/hosts.txt; fi
          fi
          wc -l app/src/main/assets/hosts.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleRelease --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk TrinhDuyet.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TrinhDuyet
          path: TrinhDuyet.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Trình Duyệt v1.0.${{ github.run_number }}
          files: TrinhDuyet.apk
