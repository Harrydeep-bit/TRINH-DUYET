<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trang chủ</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: sans-serif; background: #fff; color: #202124; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 56px 20px 24px; }
  h1 { text-align: center; font-size: 30px; margin: 0 0 6px; color: #2E7D32; }
  .sub { text-align: center; color: #5f6368; font-size: 14px; margin-bottom: 24px; }
  form { display: flex; border: 1px solid #dfe1e5; border-radius: 24px; overflow: hidden; }
  input { flex: 1; border: 0; padding: 14px 18px; font-size: 16px; outline: none; }
  button { border: 0; background: #2E7D32; color: #fff; padding: 0 20px; font-size: 15px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 32px; }
  .grid a { text-decoration: none; color: #202124; font-size: 12px; text-align: center; }
  .ic { width: 52px; height: 52px; margin: 0 auto 6px; border-radius: 50%; display: flex;
        align-items: center; justify-content: center; font-weight: bold; font-size: 20px; color: #fff; }
  .stat { text-align: center; margin-top: 32px; color: #5f6368; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Trình Duyệt</h1>
  <div class="sub">Lướt web không quảng cáo</div>
  <form action="https://www.google.com/search" method="get">
    <input name="q" placeholder="Tìm kiếm hoặc nhập địa chỉ web" autocomplete="off">
    <button type="submit">Tìm</button>
  </form>
  <div class="grid">
    <a href="https://m.youtube.com"><div class="ic" style="background:#FF0000">▶</div>YouTube</a>
    <a href="https://www.google.com"><div class="ic" style="background:#4285F4">G</div>Google</a>
    <a href="https://m.facebook.com"><div class="ic" style="background:#1877F2">f</div>Facebook</a>
    <a href="https://www.tiktok.com"><div class="ic" style="background:#111">♪</div>TikTok</a>
    <a href="https://vnexpress.net"><div class="ic" style="background:#9F224E">V</div>VnExpress</a>
    <a href="https://tuoitre.vn"><div class="ic" style="background:#ED1C24">T</div>Tuổi Trẻ</a>
    <a href="https://shopee.vn"><div class="ic" style="background:#EE4D2D">S</div>Shopee</a>
    <a href="https://www.bachhoaxanh.com"><div class="ic" style="background:#008848">B</div>Bách Hóa Xanh</a>
  </div>
  <div class="stat" id="stat"></div>
</div>
<script>
  try {
    var n = window.QuangAB ? window.QuangAB.total() : 0;
    if (n > 0) document.getElementById('stat').textContent = 'Đã chặn ' + n.toLocaleString('vi-VN') + ' quảng cáo';
  } catch (e) {}
</script>
</body>
</html>
