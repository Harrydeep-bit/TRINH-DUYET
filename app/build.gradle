plugins { id 'com.android.application' }

android {
    namespace 'vn.quang.trinhduyet'
    compileSdk 34

    defaultConfig {
        applicationId 'vn.quang.trinhduyet'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }
    signingConfigs {
        release {
            storeFile file('trinhduyet.keystore')
            storePassword 'quang123'
            keyAlias 'quang'
            keyPassword 'quang123'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
